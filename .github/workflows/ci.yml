name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The Next.js app lives in app/ (repo root is the vault); run everything there.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches Vercel's production runtime
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + dependency-cruiser boundaries)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (incl. golden simulation tests)
        run: npm test

      - name: Build
        run: npm run build
